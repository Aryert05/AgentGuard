[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "AI agent execution foundation with structured telemetry"
requires-python = ">=3.11"
dependencies = ["langgraph>=0.2,<2", "langchain>=0.3,<2", "langchain-openai>=0.2,<2", "pydantic>=2,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agentguard*"]
